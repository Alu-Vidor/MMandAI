name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *' # 09:17 Moscow time
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html style.css app.js data.js black-hole.js _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - name: Refresh public vacancy feeds
        run: python3 tools/refresh_vacancies.py _site/vacancies.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  archive-vacancies:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-package
      - name: Save published vacancy feed
        shell: bash
        run: |
          feed_ref=refs/heads/codex/vacancy-feed
          blob=$(tar -xOf "$RUNNER_TEMP/pages-package/artifact.tar" ./vacancies.json | git hash-object -w --stdin)
          tree=$(printf '100644 blob %s\tvacancies.json\n' "$blob" | git mktree)
          parent=()
          remote_ref=$(git ls-remote --heads origin "$feed_ref")
          if [[ -n "$remote_ref" ]]; then
            git fetch --depth=1 origin "$feed_ref"
            if [[ "$tree" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]]; then
              exit 0
            fi
            parent=(-p FETCH_HEAD)
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" "${parent[@]}" -m 'Archive published vacancies')
          git push origin "$commit:$feed_ref"
